<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO -->
		<title>Leakr — Stop Paying for Subscriptions You Forgot to Cancel</title>
		<meta
			name="description"
			content="Leakr auto-detects free trials in your browser and warns you before you're charged. No bank link, no account, nothing leaves your device. Free Chrome extension."
		/>
		<meta name="theme-color" content="#0E6E68" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Leakr — Never Miss a Free Trial Charge Again" />
		<meta
			property="og:description"
			content="The only subscription tracker that auto-detects trials without ever asking for your bank account. Free Chrome extension."
		/>
		<meta property="og:image" content="/og-image.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Leakr — Never Miss a Free Trial Charge Again" />
		<meta
			name="twitter:description"
			content="Auto-detect trials. No bank link. Nothing leaves your device."
		/>
		<meta name="twitter:image" content="/og-image.png" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,420;9..144,460;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
